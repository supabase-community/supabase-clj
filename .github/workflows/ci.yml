name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest
          clj-kondo: latest

      - name: Lint all modules
        run: clj-kondo --lint core/src core/test core/test-cljs auth/src auth/test postgrest/src postgrest/test-cljs functions/src functions/test-cljs --fail-level error

      - name: Check formatting
        run: clojure -M:fmt check core/src core/test core/test-cljs auth/src auth/test postgrest/src postgrest/test-cljs functions/src functions/test-cljs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["21", "17"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest

      - name: Cache Maven deps
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/deps.edn') }}
          restore-keys: m2-

      - name: Run all tests
        run: clojure -M:test

  cljs-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Maven deps
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-cljs-${{ hashFiles('**/deps.edn') }}
          restore-keys: m2-cljs-

      - name: Compile and run core ClojureScript tests
        working-directory: core
        run: |
          clojure -M:cljs compile node-test
          node target/node-tests.js

      - name: Compile and run functions ClojureScript tests
        working-directory: functions
        run: |
          clojure -M:cljs compile node-test
          node target/node-tests.js
        
      - name: Compile and run postgrest ClojureScript tests
        working-directory: postgrest
        run: |
          clojure -M:cljs compile node-test
          node target/node-tests.js
